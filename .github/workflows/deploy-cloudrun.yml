name: Deploy to Google Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: personal-finance-app
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Google Cloud Auth
      if: env.PROJECT_ID != ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      if: env.PROJECT_ID != ''
      uses: google-github-actions/setup-gcloud@v2

    - name: Authorize Docker to push to Google Container Registry
      if: env.PROJECT_ID != ''
      run: gcloud auth configure-docker --quiet

    - name: Build and Push Docker Image
      if: env.PROJECT_ID != ''
      run: |
        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/$SERVICE_NAME:${{ github.sha }} -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/$SERVICE_NAME:latest .
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/$SERVICE_NAME:${{ github.sha }}
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/$SERVICE_NAME:latest

    - name: Deploy to Cloud Run
      if: env.PROJECT_ID != ''
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/$SERVICE_NAME:${{ github.sha }} \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --set-env-vars "PORT=8080,SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }},SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }},SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}"
